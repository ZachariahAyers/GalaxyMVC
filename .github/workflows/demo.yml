name: demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/zachariahayers/galaxymvc:latest
          # Links the package to the repo; the demo instance prunes old images by this label.
          labels: org.opencontainers.image.source=https://github.com/ZachariahAyers/GalaxyMVC

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::993011736775:role/gh-deploy-opensource-galaxymvc
          aws-region: us-east-1

      - name: Redeploy on the demo instance
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          DOC: opensource-redeploy-galaxymvc
          INSTANCE: i-04665903be2862f70
        run: |
          set -euo pipefail
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name "$DOC" \
            --parameters "{\"ImageDigest\":[\"$DIGEST\"]}" --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 120); do
            # A new invocation is not readable at once; a refused read counts as pending.
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success | Failed | Cancelled | TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text || true
          [ "$status" = Success ] || { echo "::error::the redeploy ended $status"; exit 1; }
